name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        abi: [arm64-v8a, armeabi-v7a, x86_64]
    steps:
      - uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install NDK
        run: |
          sdkmanager --install "ndk;27.0.12077973" 2>/dev/null || sdkmanager --install "ndk;26.1.10909125"
          ANDROID_NDK_ROOT=$(ls -d $ANDROID_SDK_ROOT/ndk/*/toolchains/llvm/prebuilt/linux-x86_64 2>/dev/null | sort -V | tail -1 | sed 's|/toolchains/llvm/prebuilt/linux-x86_64||')
          echo "ANDROID_NDK_HOME=$ANDROID_NDK_ROOT" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> $GITHUB_ENV

      - name: Build Go client (${{ matrix.abi }})
        env:
          GOOS: android
          CGO_ENABLED: 1
        working-directory: go_client
        run: |
          ABI=${{ matrix.abi }}
          case $ABI in
            arm64-v8a)
              export CC=$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android29-clang
              export GOARCH=arm64
              ;;
            armeabi-v7a)
              export CC=$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/armv7a-linux-androideabi29-clang
              export GOARCH=arm
              export GOARM=7
              ;;
            x86_64)
              export CC=$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/x86_64-linux-android29-clang
              export GOARCH=amd64
              ;;
          esac
          go mod tidy
          mkdir -p ../app/src/main/jniLibs/$ABI
          go build -trimpath -ldflags="-s -w -checklinkname=0" -buildmode=c-shared -o ../app/src/main/jniLibs/$ABI/libclient.so .

      - name: Build server binary
        run: |
          go mod tidy
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -ldflags="-s -w" -o app/src/main/assets/server .

      - name: Upload artifact (${{ matrix.abi }})
        uses: actions/upload-artifact@v4
        with:
          name: libclient-${{ matrix.abi }}
          path: app/src/main/jniLibs/${{ matrix.abi }}/libclient.so

  assemble:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Download all .so artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: libclient-*
          merge-multiple: true
          path: app/src/main/jniLibs

      - name: Assemble Release APK
        run: |
          echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          cat local.properties
          ./gradlew :app:assembleRelease

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: max-tunnel-plus-apks
          path: app/build/outputs/apk/release/*.apk
          retention-days: 30
